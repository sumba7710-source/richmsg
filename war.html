<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03050a;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100%;
    max-width:900px;
    height:620px;
    margin:auto;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#17263a 0%,#080e18 48%,#020409 100%);
}

/* ================= STAR / GRID ================= */

#stars{
    position:absolute;
    inset:0;
    opacity:.55;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#69dfff 1px,transparent 1px);
    background-size:80px 80px,130px 130px;
    background-position:10px 20px,50px 70px;
}

#grid{
    position:absolute;
    left:-100px;
    right:-100px;
    bottom:-120px;
    height:330px;
    opacity:.13;
    transform:perspective(250px) rotateX(55deg);
    background-image:
        linear-gradient(#55dfff 1px,transparent 1px),
        linear-gradient(90deg,#55dfff 1px,transparent 1px);
    background-size:40px 40px;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:10px;
    left:12px;
    right:12px;
    z-index:50;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    color:#65e9ff;
    font-size:15px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 0 12px #35dfff;
}

.stats{
    display:flex;
    gap:7px;
}

.stat{
    padding:7px 9px;
    border:1px solid #314655;
    border-radius:9px;
    background:rgba(2,7,13,.8);
    font-size:10px;
    color:#9badba;
}

.stat b{
    color:#fff;
}

.bars{
    margin-top:8px;
    width:100%;
}

.bar{
    height:9px;
    margin-top:4px;
    background:#111b24;
    border:1px solid #30414e;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    transition:.15s;
}

#hp{
    width:100%;
    background:#2eea79;
}

#energy{
    width:100%;
    background:#35dfff;
}

#xp{
    width:0%;
    background:#c86cff;
}

#waveText{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    z-index:40;
    color:#fff;
    font-weight:900;
    font-size:18px;
    text-shadow:0 0 15px #35dfff;
}

/* ================= ARENA ================= */

#arena{
    position:absolute;
    inset:0;
    overflow:hidden;
}

#player{
    position:absolute;
    width:44px;
    height:44px;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    z-index:20;
}

.core{
    position:absolute;
    width:25px;
    height:25px;
    left:9px;
    top:9px;
    border-radius:50%;
    background:#eaffff;
    border:5px solid #39dfff;
    box-shadow:
        0 0 10px #39dfff,
        0 0 25px #39dfff;
}

.ring{
    position:absolute;
    inset:0;
    border:2px solid #50eaff;
    border-radius:50%;
    animation:spin 1.2s linear infinite;
}

.ring2{
    position:absolute;
    inset:6px;
    border:2px dashed #b55cff;
    border-radius:50%;
    animation:spin 1.8s linear reverse infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ================= ENEMY ================= */

.enemy{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:9px;
    background:#e83b59;
    border:2px solid #ff7185;
    box-shadow:0 0 10px rgba(255,50,80,.35);
    z-index:12;
}

.enemy:after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    left:11px;
    top:11px;
    box-shadow:0 0 8px #fff;
}

.enemy.fast{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#b43cff;
    border-color:#d58aff;
}

.enemy.tank{
    width:48px;
    height:48px;
    border-radius:13px;
    background:#91302e;
    border:3px solid #ff6c4e;
}

.enemy.elite{
    width:42px;
    height:42px;
    background:#ff9d24;
    border-color:#ffe27b;
    box-shadow:0 0 18px #ff9d24;
}

.enemy.boss{
    width:85px;
    height:85px;
    border-radius:25px;
    background:#741cff;
    border:4px solid #e08aff;
    box-shadow:
        0 0 15px #9a43ff,
        0 0 45px #7020ff;
}

.enemy.boss:after{
    width:20px;
    height:20px;
    left:29px;
    top:29px;
    background:#ff355e;
    box-shadow:0 0 15px #ff355e;
}

/* ================= ENEMY HP ================= */

.enemyHP{
    position:absolute;
    width:100%;
    height:4px;
    left:0;
    top:-9px;
    background:#28131a;
    border-radius:5px;
    overflow:hidden;
}

.enemyHP div{
    height:100%;
    background:#ff3d5d;
}

/* ================= BULLETS ================= */

.bullet{
    position:absolute;
    width:10px;
    height:5px;
    border-radius:10px;
    background:#69f5ff;
    box-shadow:
        0 0 8px #69f5ff,
        0 0 16px #69f5ff;
    z-index:15;
}

.bullet.enemyBullet{
    background:#ff4768;
    box-shadow:0 0 12px #ff4768;
}

/* ================= ORBS ================= */

.orb{
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#bd62ff;
    box-shadow:
        0 0 8px #bd62ff,
        0 0 15px #bd62ff;
    z-index:8;
}

/* ================= PARTICLES ================= */

.particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    pointer-events:none;
    z-index:60;
}

/* ================= DAMAGE ================= */

.damage{
    position:absolute;
    z-index:70;
    color:#fff;
    font-weight:900;
    font-size:15px;
    pointer-events:none;
    animation:damage .55s forwards;
    text-shadow:0 0 8px #ff4562;
}

.damage.crit{
    color:#ffe45b;
    font-size:21px;
}

@keyframes damage{
    from{
        opacity:1;
        transform:translateY(0) scale(1);
    }
    to{
        opacity:0;
        transform:translateY(-38px) scale(1.25);
    }
}

/* ================= COMBO ================= */

#combo{
    position:absolute;
    right:15px;
    top:115px;
    z-index:40;
    text-align:right;
    opacity:0;
    transition:.2s;
}

#comboNum{
    font-size:30px;
    font-weight:900;
    color:#ffdc4d;
    text-shadow:0 0 15px #ff9d00;
}

#comboLabel{
    font-size:9px;
    color:#aaa;
}

/* ================= BOSS BAR ================= */

#bossBar{
    position:absolute;
    display:none;
    left:15%;
    right:15%;
    bottom:115px;
    z-index:40;
}

#bossName{
    text-align:center;
    color:#ff5978;
    font-weight:900;
    font-size:11px;
    margin-bottom:5px;
}

.bossTrack{
    height:12px;
    background:#21101a;
    border:1px solid #743344;
    border-radius:20px;
    overflow:hidden;
}

#bossHP{
    width:100%;
    height:100%;
    background:#b52cff;
}

/* ================= CONTROLS ================= */

#controls{
    position:absolute;
    bottom:12px;
    left:12px;
    right:12px;
    z-index:80;
    display:flex;
    justify-content:space-between;
}

.controlGroup{
    display:flex;
    gap:8px;
}

.btn{
    width:58px;
    height:54px;
    border:1px solid #405462;
    border-radius:13px;
    background:rgba(7,15,23,.9);
    color:#fff;
    font-size:18px;
    font-weight:900;
}

.btn:active{
    transform:scale(.9);
}

.dash{
    border-color:#36e0ff;
    color:#54eaff;
}

.skill{
    border-color:#c15cff;
    color:#d48cff;
}

.attack{
    border-color:#ff506a;
    color:#ff6279;
}

/* ================= OVERLAY ================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:100;
    background:
        radial-gradient(circle,#182b3c,#03060b 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:3px;
    color:#63eaff;
    text-shadow:
        0 0 10px #37ddff,
        0 0 35px #176dff;
}

.sub{
    color:#7f939f;
    font-size:11px;
    letter-spacing:3px;
    margin-top:7px;
}

.start{
    margin-top:30px;
    padding:14px 40px;
    border:1px solid #45e5ff;
    border-radius:12px;
    background:#09202a;
    color:#7eefff;
    font-weight:900;
    box-shadow:0 0 20px rgba(50,220,255,.2);
}

.help{
    margin-top:15px;
    color:#647681;
    font-size:9px;
}

/* ================= LEVEL UP ================= */

#levelup{
    position:absolute;
    inset:0;
    z-index:95;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(2,4,9,.88);
}

#levelup h2{
    color:#d66aff;
    font-size:30px;
    text-shadow:0 0 20px #a32cff;
}

#upgradeCards{
    display:flex;
    gap:8px;
    margin-top:20px;
    padding:0 10px;
}

.upgrade{
    width:105px;
    min-height:120px;
    padding:12px 7px;
    border:1px solid #66457c;
    border-radius:12px;
    background:#111522;
    color:#fff;
}

.upgrade b{
    display:block;
    color:#d976ff;
    margin-bottom:8px;
    font-size:12px;
}

.upgrade small{
    color:#8895a5;
    font-size:9px;
    line-height:1.4;
}

/* ================= GAMEOVER ================= */

#gameover{
    position:absolute;
    inset:0;
    z-index:110;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.9);
    text-align:center;
}

#gameover h2{
    font-size:38px;
    color:#ff4962;
}

#gameover p{
    margin:8px 0 22px;
    color:#8d9aa4;
    font-size:11px;
}

.restart{
    padding:13px 35px;
    border:0;
    border-radius:10px;
    background:#d52e4c;
    color:#fff;
    font-weight:900;
}

/* ================= SHAKE ================= */

.shake{
    animation:shake .16s;
}

@keyframes shake{
    0%,100%{transform:translate(0)}
    25%{transform:translate(-7px,3px)}
    50%{transform:translate(7px,-3px)}
    75%{transform:translate(-4px,2px)}
}
</style>


<div id="game">

<script>

/* =========================================
   FARZ NEON SURVIVOR
   ========================================= */

const game =
    document.getElementById("game");

const arena =
    document.getElementById("arena");

const player =
    document.getElementById("player");

const hpBar =
    document.getElementById("hp");

const energyBar =
    document.getElementById("energy");

const xpBar =
    document.getElementById("xp");

let running = false;

let level = 1;
let wave = 1;

let score = 0;
let coins = 0;
let xp = 0;

let maxHP = 100;
let hp = 100;

let energy = 100;

let damagePower = 20;
let moveSpeed = 3;

let playerX = 0;
let playerY = 0;

let enemies = [];
let bullets = [];
let orbs = [];

let left = false;
let right = false;

let combo = 0;
let comboTimer = 0;

let waveKills = 0;
let waveTarget = 6;

let dashCooldown = 0;
let specialCooldown = 0;


/* =========================================
   START
   ========================================= */

function startGame(){

    document.getElementById("startScreen")
        .style.display = "none";

    playerX =
        arena.clientWidth / 2;

    playerY =
        arena.clientHeight / 2;

    running = true;

    spawnWave();

    requestAnimationFrame(loop);
}


/* =========================================
   WAVE
   ========================================= */

function spawnWave(){

    waveTarget =
        5 + Math.floor(wave * 1.7);

    waveKills = 0;

    document.getElementById("wave")
        .textContent = wave;

    for(
        let i=0;
        i<waveTarget;
        i++
    ){

        setTimeout(
            ()=>spawnEnemy(false),
            i*180
        );

    }

    if(wave % 5 === 0){

        setTimeout(
            ()=>spawnEnemy(true),
            700
        );

    }

}


/* =========================================
   SPAWN ENEMY
   ========================================= */

function spawnEnemy(boss){

    if(!running) return;

    const el =
        document.createElement("div");

    let type = "";

    if(boss){

        type = "boss";

    }else{

        const r =
            Math.random();

        if(r < .18)
            type = "fast";

        else if(r < .32)
            type = "tank";

        else if(r < .42)
            type = "elite";

    }

    el.className =
        "enemy " + type;

    const hp =
        boss
        ? 600 + wave*100
        : type === "tank"
        ? 150 + wave*20
        : type === "elite"
        ? 110 + wave*15
        : type === "fast"
        ? 45 + wave*8
        : 65 + wave*10;

    el.innerHTML = `
        <div class="enemyHP">
            <div></div>
        </div>
    `;

    arena.appendChild(el);

    let x,y;

    const side =
        Math.floor(
            Math.random()*4
        );

    if(side===0){
        x = -50;
        y = Math.random()*arena.clientHeight;
    }

    if(side===1){
        x = arena.clientWidth+50;
        y = Math.random()*arena.clientHeight;
    }

    if(side===2){
        x = Math.random()*arena.clientWidth;
        y = -50;
    }

    if(side===3){
        x = Math.random()*arena.clientWidth;
        y = arena.clientHeight+50;
    }

    const enemy = {

        el:el,

        x:x,
        y:y,

        hp:hp,
        maxHP:hp,

        boss:boss,

        speed:
            boss
            ? .55 + wave*.02
            : type==="fast"
            ? 1.5 + wave*.04
            : type==="tank"
            ? .45 + wave*.015
            : .8 + wave*.025,

        damage:
            boss
            ? 15 + wave
            : 5 + wave*.6,

        attackTimer:
            60 + Math.random()*70

    };

    enemies.push(enemy);

    drawEnemy(enemy);

    if(boss){

        document.getElementById("bossBar")
            .style.display = "block";

        updateBoss(enemy);

    }

}


/* =========================================
   DRAW ENEMY
   ========================================= */

function drawEnemy(e){

    e.el.style.left =
        e.x + "px";

    e.el.style.top =
        e.y + "px";

    const bar =
        e.el.querySelector(
            ".enemyHP div"
        );

    if(bar){

        bar.style.width =
            (e.hp/e.maxHP*100)+"%";

    }

}


/* =========================================
   ENEMY AI
   ========================================= */

function enemyAI(e){

    const dx =
        playerX-e.x;

    const dy =
        playerY-e.y;

    const distance =
        Math.hypot(dx,dy);

    if(distance > 45){

        e.x +=
            dx/distance *
            e.speed;

        e.y +=
            dy/distance *
            e.speed;

    }else{

        e.attackTimer--;

        if(e.attackTimer<=0){

            enemyAttack(e);

            e.attackTimer =
                e.boss
                ? 55
                : 90;

        }

    }

    drawEnemy(e);

    if(e.boss)
        updateBoss(e);

}


/* =========================================
   ENEMY ATTACK
   ========================================= */

function enemyAttack(e){

    if(
        Math.hypot(
            playerX-e.x,
            playerY-e.y
        ) > 65
    ) return;

    hp -=
        e.damage;

    damageNumber(
        playerX,
        playerY,
        Math.floor(e.damage),
        false
    );

    shake();

    if(hp<=0){

        hp=0;

        gameOver();

    }

}


/* =========================================
   AUTO ATTACK
   ========================================= */

let autoTimer = 0;

function autoAttack(){

    if(enemies.length===0)
        return;

    let nearest = null;
    let distance = Infinity;

    enemies.forEach(e=>{

        const d =
            Math.hypot(
                playerX-e.x,
                playerY-e.y
            );

        if(d<distance){

            distance=d;
            nearest=e;

        }

    });

    if(!nearest) return;

    shoot(nearest);

}


/* =========================================
   SHOOT
   ========================================= */

function shoot(target){

    const bullet =
        document.createElement("div");

    bullet.className =
        "bullet";

    arena.appendChild(bullet);

    const dx =
        target.x-playerX;

    const dy =
        target.y-playerY;

    const distance =
        Math.hypot(dx,dy);

    bullets.push({

        el:bullet,

        x:playerX+20,
        y:playerY+20,

        vx:dx/distance*8,
        vy:dy/distance*8,

        damage:damagePower

    });

}


/* =========================================
   MANUAL ATTACK
   ========================================= */

function manualAttack(){

    if(!running) return;

    autoAttack();

}


/* =========================================
   SPECIAL
   ========================================= */

function special(){

    if(!running) return;

    if(
        energy < 40 ||
        specialCooldown > 0
    ) return;

    energy -= 40;

    specialCooldown = 3;

    /* radial attack */

    enemies.forEach(e=>{

        const d =
            Math.hypot(
                playerX-e.x,
                playerY-e.y
            );

        if(d<230){

            const damage =
                damagePower*3;

            e.hp -= damage;

            damageNumber(
                e.x,
                e.y,
                damage,
                true
            );

            if(e.hp<=0)
                killEnemy(e);

        }

    });

    for(let i=0;i<35;i++)
        particle(
            playerX+20,
            playerY+20
        );

    shake();

}


/* =========================================
   DASH
   ========================================= */

function dash(){

    if(!running) return;

    if(
        energy < 25 ||
        dashCooldown > 0
    ) return;

    energy -= 25;

    dashCooldown = 1.2;

    let direction = 0;

    if(left)
        direction=-1;

    if(right)
        direction=1;

    if(direction===0)
        direction=1;

    playerX +=
        direction*110;

    playerX =
        Math.max(
            10,
            Math.min(
                arena.clientWidth-55,
                playerX
            )
        );

}


/* =========================================
   BULLETS
   ========================================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        b.el.style.left =
            b.x+"px";

        b.el.style.top =
            b.y+"px";

        let hit = false;

        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e =
                enemies[j];

            const d =
                Math.hypot(
                    b.x-e.x,
                    b.y-e.y
                );

            if(d<28){

                e.hp -= b.damage;

                damageNumber(
                    e.x,
                    e.y,
                    Math.floor(b.damage),
                    Math.random()<.12
                );

                hit=true;

                if(e.hp<=0)
                    killEnemy(e);

                break;

            }

        }

        if(
            hit ||
            b.x<-100 ||
            b.x>arena.clientWidth+100 ||
            b.y<-100 ||
            b.y>arena.clientHeight+100
        ){

            b.el.remove();

            bullets.splice(i,1);

        }

    }

}


/* =========================================
   KILL
   ========================================= */

function killEnemy(e){

    if(!enemies.includes(e))
        return;

    e.el.remove();

    enemies =
        enemies.filter(
            x=>x!==e
        );

    waveKills++;

    score +=
        e.boss
        ? 2500
        : e.el.classList.contains("elite")
        ? 400
        : 100;

    coins +=
        e.boss
        ? 30
        : 2+Math.floor(Math.random()*4);

    xp +=
        e.boss
        ? 100
        : 25;

    combo++;
    comboTimer=2.5;

    createOrb(
        e.x,
        e.y
    );

    for(let i=0;i<8;i++)
        particle(e.x,e.y);

    if(e.boss){

        document.getElementById("bossBar")
            .style.display="none";

    }

    if(
        xp >=
        level*100
    ){

        xp -=
            level*100;

        levelUp();

    }

    if(
        waveKills>=waveTarget &&
        !enemies.some(e=>e.boss)
    ){

        nextWave();

    }

}


/* =========================================
   XP ORB
   ========================================= */

function createOrb(x,y){

    const el =
        document.createElement("div");

    el.className="orb";

    arena.appendChild(el);

    orbs.push({

        el:el,
        x:x,
        y:y

    });

}


/* =========================================
   ORBS
   ========================================= */

function updateOrbs(){

    for(
        let i=orbs.length-1;
        i>=0;
        i--
    ){

        const o =
            orbs[i];

        const dx =
            playerX-o.x;

        const dy =
            playerY-o.y;

        const d =
            Math.hypot(dx,dy);

        if(d<100){

            o.x +=
                dx*.12;

            o.y +=
                dy*.12;

        }

        o.el.style.left =
            o.x+"px";

        o.el.style.top =
            o.y+"px";

        if(d<25){

            xp += 10;

            o.el.remove();

            orbs.splice(i,1);

        }

    }

}


/* =========================================
   LEVEL UP
   ========================================= */

function levelUp(){

    running=false;

    document.getElementById("levelup")
        .style.display="flex";

}


/* =========================================
   UPGRADE
   ========================================= */

function upgrade(type){

    if(type==="damage")
        damagePower*=1.25;

    if(type==="speed")
        moveSpeed*=1.2;

    if(type==="health"){

        maxHP+=30;
        hp=maxHP;

    }

    level++;

    document.getElementById("level")
        .textContent=level;

    document.getElementById("levelup")
        .style.display="none";

    running=true;

}


/* =========================================
   NEXT WAVE
   ========================================= */

function nextWave(){

    wave++;

    energy=100;

    setTimeout(
        spawnWave,
        800
    );

}


/* =========================================
   PARTICLES
   ========================================= */

function particle(x,y){

    const p =
        document.createElement("div");

    p.className="particle";

    p.style.left=x+"px";
    p.style.top=y+"px";

    p.style.background =
        Math.random()>.5
        ? "#4ceaff"
        : "#c35cff";

    arena.appendChild(p);

    let vx =
        (Math.random()-.5)*6;

    let vy =
        (Math.random()-.5)*6;

    let life=30;

    const timer =
        setInterval(()=>{

            x+=vx;
            y+=vy;

            vx*=.94;
            vy*=.94;

            p.style.left=x+"px";
            p.style.top=y+"px";

            p.style.opacity=
                life/30;

            life--;

            if(life<=0){

                clearInterval(timer);
                p.remove();

            }

        },16);

}


/* =========================================
   DAMAGE NUMBER
   ========================================= */

function damageNumber(
    x,
    y,
    damage,
    crit
){

    const d =
        document.createElement("div");

    d.className =
        crit
        ? "damage crit"
        : "damage";

    d.textContent =
        crit
        ? "CRIT "+Math.floor(damage)
        : Math.floor(damage);

    d.style.left=x+"px";
    d.style.top=y+"px";

    arena.appendChild(d);

    setTimeout(
        ()=>d.remove(),
        550
    );

}


/* =========================================
   BOSS HUD
   ========================================= */

function updateBoss(e){

    const bar =
        document.getElementById("bossHP");

    bar.style.width =
        Math.max(
            0,
            e.hp/e.maxHP*100
        )+"%";

}


/* =========================================
   PLAYER
   ========================================= */

function updatePlayer(){

    if(left)
        playerX-=moveSpeed;

    if(right)
        playerX+=moveSpeed;

    playerX =
        Math.max(
            10,
            Math.min(
                arena.clientWidth-55,
                playerX
            )
        );

    playerY =
        Math.max(
            105,
            Math.min(
                arena.clientHeight-75,
                playerY
            )
        );

    player.style.left=
        playerX+"px";

    player.style.top=
        playerY+"px";

}


/* =========================================
   COMBO
   ========================================= */

function updateCombo(){

    if(comboTimer>0){

        comboTimer-=.016;

    }else{

        combo=0;

    }

    const c =
        document.getElementById("combo");

    if(combo>1){

        c.style.opacity="1";

        document.getElementById("comboNum")
            .textContent="x"+combo;

    }else{

        c.style.opacity="0";

    }

}


/* =========================================
   UI
   ========================================= */

function updateUI(){

    hpBar.style.width =
        hp/maxHP*100+"%";

    energyBar.style.width =
        energy+"%";

    xpBar.style.width =
        Math.min(
            100,
            xp/(level*100)*100
        )+"%";

    document.getElementById("level")
        .textContent=level;

    document.getElementById("coins")
        .textContent=coins;

    document.getElementById("score")
        .textContent=score;

}


/* =========================================
   SHAKE
   ========================================= */

function shake(){

    game.classList.remove("shake");

    void game.offsetWidth;

    game.classList.add("shake");

}


/* =========================================
   LOOP
   ========================================= */

function loop(){

    if(!running){

        requestAnimationFrame(loop);
        return;

    }

    updatePlayer();

    enemies.forEach(enemyAI);

    updateBullets();

    updateOrbs();

    updateCombo();

    energy =
        Math.min(
            100,
            energy+.12
        );

    autoTimer--;

    if(autoTimer<=0){

        autoAttack();

        autoTimer=18;

    }

    if(dashCooldown>0)
        dashCooldown-=.016;

    if(specialCooldown>0)
        specialCooldown-=.016;

    updateUI();

    requestAnimationFrame(loop);

}


/* =========================================
   GAME OVER
   ========================================= */

function gameOver(){

    running=false;

    document.getElementById("finalText")
        .textContent =
        "WAVE "+wave+
        " • LEVEL "+level+
        " • SCORE "+score;

    document.getElementById("gameover")
        .style.display="flex";

}


/* =========================================
   RESTART
   ========================================= */

function restart(){

    enemies.forEach(
        e=>e.el.remove()
    );

    bullets.forEach(
        b=>b.el.remove()
    );

    orbs.forEach(
        o=>o.el.remove()
    );

    enemies=[];
    bullets=[];
    orbs=[];

    level=1;
    wave=1;

    score=0;
    coins=0;
    xp=0;

    maxHP=100;
    hp=100;

    energy=100;

    damagePower=20;
    moveSpeed=3;

    combo=0;

    document.getElementById("gameover")
        .style.display="none";

    startGame();

}


/* =========================================
   TOUCH
   ========================================= */

function hold(
    el,
    down,
    up
){

    el.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            down();
        }
    );

    el.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            up();
        }
    );

    el.addEventListener(
        "mousedown",
        down
    );

    el.addEventListener(
        "mouseup",
        up
    );

    el.addEventListener(
        "mouseleave",
        up
    );

}


hold(
    document.getElementById("left"),
    ()=>left=true,
    ()=>left=false
);

hold(
    document.getElementById("right"),
    ()=>right=true,
    ()=>right=false
);


/* =========================================
   KEYBOARD
   ========================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowLeft" || e.key==="a")
            left=true;

        if(e.key==="ArrowRight" || e.key==="d")
            right=true;

        if(e.key==="x")
            manualAttack();

        if(e.key==="z")
            special();

        if(e.key==="Shift")
            dash();

    }
);

document.addEventListener(
    "keyup",
    e=>{

        if(e.key==="ArrowLeft" || e.key==="a")
            left=false;

        if(e.key==="ArrowRight" || e.key==="d")
            right=false;

    }
);


/* =========================================
   INIT
   ========================================= */

updateUI();

</script>
